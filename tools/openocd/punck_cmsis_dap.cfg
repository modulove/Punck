# Punck (STM32H743) over SWD with any CMSIS-DAP probe (e.g. Raspberry Pi Pico running debugprobe)
# Wiring to J6 on the component board: pin2 GND, pin3 SWDIO, pin4 SWCLK (pin1 3V3 left unconnected)
# J6 has no NRST, so resets are done in software (SYSRESETREQ).
#
# Minimal config instead of ST's stm32h7x.cfg: on the Punck DBGMCU_CR is 0 at connect (D1/D3 debug clocks off)
# and the first core (AP0) access returns a junk SWD ACK. So: examine the APB-D access port (AP2) first,
# enable the debug clocks through it, then examine the Cortex-M7.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 500
reset_config none
source [find target/swj-dp.tcl]

set _CHIPNAME stm32h743
swj_newdap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x6ba02477
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

target create $_CHIPNAME.ap2 mem_ap -dap $_CHIPNAME.dap -ap-num 2
# Raw memory access through AP0 without examining/halting the core (read-only backups while the module runs)
target create $_CHIPNAME.ap0 mem_ap -dap $_CHIPNAME.dap -ap-num 0
target create $_CHIPNAME.cm7 cortex_m -dap $_CHIPNAME.dap -ap-num 0 \
	-work-area-phys 0x24000000 -work-area-size 0x8000 -work-area-backup 0
$_CHIPNAME.cm7 cortex_m reset_config sysresetreq

flash bank $_CHIPNAME.bank1.cm7 stm32h7x 0x08000000 0 0 0 $_CHIPNAME.cm7
flash bank $_CHIPNAME.bank2.cm7 stm32h7x 0x08100000 0 0 0 $_CHIPNAME.cm7

# DBGMCU_CR (via AP2 at 0xE00E1004): D3DBGCKEN | D1DBGCKEN | keep debug alive in sleep/stop/standby (D1, D2)
proc punck_dbg_clocks {} {
	stm32h743.ap2 mww 0xE00E1004 0x0060003F
}
# AP2 is created (and therefore examined) first: enable the debug clocks before the Cortex-M7 is examined
$_CHIPNAME.ap2 configure -event examine-end { catch {punck_dbg_clocks} }

# Chunked dump through AP0 with retries per chunk (tolerates occasional SWD errors); files prefix_NNNN.bin
proc punck_dump {prefix base size chunk retries} {
	catch {punck_dbg_clocks}
	targets stm32h743.ap0
	set n 0
	for {set off 0} {$off < $size} {incr off $chunk} {
		set fname [format "%s_%04d.bin" $prefix $n]
		set done 0
		for {set t 0} {$t < $retries && !$done} {incr t} {
			if {![catch {dump_image "$fname" [expr {$base + $off}] $chunk}]} {
				set done 1
			}
		}
		if {!$done} {
			echo "DUMPFAIL chunk $n"
			return
		}
		incr n
	}
	echo "DUMPOK $n chunks"
}

# Call after 'init': enable debug clocks, then examine the core and make it the current target
proc punck_attach {} {
	catch {punck_dbg_clocks}
	if {![stm32h743.cm7 was_examined]} {
		stm32h743.cm7 arp_examine
	}
	targets stm32h743.cm7
}
